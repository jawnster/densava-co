<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>densava — Stronger together in oral health</title>
<meta name="description" content="densava turns dental decisions into shared knowledge: what people tried, what helped, what they'd want you to know." />
<meta name="theme-color" content="#EFEDE6" />

<meta property="og:type" content="website" />
<meta property="og:title" content="densava" />
<meta property="og:description" content="Stronger together in oral health." />
<meta property="og:url" content="https://densava.co" />
<meta name="twitter:card" content="summary" />
<meta name="twitter:title" content="densava" />
<meta name="twitter:description" content="Stronger together in oral health." />

<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
<link rel="apple-touch-icon" href="/favicon.svg" />

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=DM+Serif+Display&family=Outfit:wght@500;600&display=swap" rel="stylesheet" />

<style>
  :root {
    --page:           #EFEDE6;
    --navy:           #1B2D4F;
    --ink:            #1B2D4F;
    --ink-muted:      #4A5568;
    --ink-subtle:     #9BAAB8;
    --teal:           #0D7377;
    --teal-ghost:     #F0FAFA;
    --teal-hairline:  #BFE0E0;
    --white:          #FFFFFF;
    --border:         #DDE2E8;
    --red:            #C0544A;

    --font-sans:   'DM Sans', system-ui, -apple-system, sans-serif;
    --font-serif:  'DM Serif Display', Georgia, serif;
    --font-mark:   'Outfit', sans-serif;

    --shadow-sm:   0 1px 2px rgba(27, 45, 79, 0.04);
    --radius-lg:   16px;
  }

  *, *::before, *::after { box-sizing: border-box; }

  html, body {
    margin: 0;
    min-height: 100%;
    background: var(--page);
    color: var(--ink);
    font-family: var(--font-sans);
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }

  /* ────────────────────────────────────────────────────────────
     layout
  ──────────────────────────────────────────────────────────── */
  .splash {
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    background: var(--page);
    padding: clamp(28px, 6vw, 72px);
  }

  .splash__inner {
    width: 100%;
    max-width: 900px;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  /* ────────────────────────────────────────────────────────────
     wordmark — uses the existing densava.co inline SVG pattern
     so the smile arc geometry matches DensavaWordmark exactly
  ──────────────────────────────────────────────────────────── */
  .wordmark {
    font-family: var(--font-mark);
    font-weight: 500;
    letter-spacing: -0.02em;
    line-height: 1;
    white-space: nowrap;
    display: inline-block;
    color: var(--navy);
    font-size: clamp(42px, 8vw, 62px);
    margin-bottom: clamp(34px, 6vw, 56px);
  }
  .wordmark__v { display: inline-block; position: relative; }
  .wordmark__smile-wrap {
    position: absolute;
    left: 50%;
    top: 100%;
    transform: translateX(-50%);
    padding-top: 0.09em;
    line-height: 0;
  }
  .wordmark__smile {
    display: block;
    overflow: visible;
    width: 0.58em;
    height: calc(0.58em * (44 / 110));
  }
  .wordmark__smile path {
    fill: none;
    stroke: var(--teal);
    stroke-width: 9;
    stroke-linecap: round;
  }

  /* ────────────────────────────────────────────────────────────
     headline + description
  ──────────────────────────────────────────────────────────── */
  .splash__head {
    font-family: var(--font-serif);
    font-weight: 400;
    color: var(--ink);
    font-size: clamp(34px, 6.6vw, 56px);
    line-height: 1.08;
    letter-spacing: -0.018em;
    margin: 0;
  }

  .splash__sub {
    font-family: var(--font-sans);
    font-weight: 400;
    color: var(--ink-muted);
    font-size: clamp(16px, 2.2vw, 18px);
    line-height: 1.65;
    max-width: 52ch;
    margin: clamp(22px, 3.4vw, 32px) 0 0;
    text-wrap: pretty;
  }

  /* ────────────────────────────────────────────────────────────
     form block + eyebrow
  ──────────────────────────────────────────────────────────── */
  .splash__formblock {
    margin-top: clamp(44px, 7.5vw, 68px);
    width: 100%;
  }

  .splash__formlabel {
    font-family: var(--font-sans);
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--teal);
    margin: 0 0 18px;
  }

  /* form shell */
  .wf {
    display: flex;
    align-items: center;
    gap: 8px;
    background: var(--white);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    padding: 8px;
    max-width: 460px;
    margin: 0 auto;
    box-shadow: var(--shadow-sm);
  }

  .wf__input {
    flex: 1;
    min-width: 0;
    border: none;
    outline: none;
    background: transparent;
    font-family: var(--font-sans);
    font-weight: 400;
    font-size: 16px;
    color: var(--ink);
    padding: 12px 14px;
    caret-color: var(--teal);
  }
  .wf__input::placeholder { color: var(--ink-subtle); }

  /* kill chrome/safari autofill yellow — keep the field looking the same when prefilled */
  .wf__input:-webkit-autofill,
  .wf__input:-webkit-autofill:hover,
  .wf__input:-webkit-autofill:focus,
  .wf__input:-webkit-autofill:active {
    -webkit-box-shadow: 0 0 0 1000px var(--white) inset !important;
    -webkit-text-fill-color: var(--ink) !important;
    caret-color: var(--teal) !important;
    transition: background-color 0s 600000s, color 0s 600000s !important;
  }

  .wf__btn {
    flex: 0 0 auto;
    border: none;
    cursor: pointer;
    background: var(--teal);
    color: var(--white);
    font-family: var(--font-sans);
    font-weight: 600;
    font-size: 15px;
    padding: 12px 22px;
    border-radius: 11px;
    white-space: nowrap;
    transition: opacity 160ms, filter 160ms, transform 100ms;
  }
  .wf__btn:hover { filter: brightness(1.06); }
  .wf__btn:active { transform: scale(0.98); }
  .wf__btn[disabled] {
    opacity: 0.5;
    cursor: default;
    filter: none;
  }
  .wf__btn[disabled]:active { transform: none; }

  /* honeypot — visually hidden but technically still in the form */
  .honeypot {
    position: absolute;
    left: -10000px;
    width: 1px;
    height: 1px;
    overflow: hidden;
    opacity: 0;
    pointer-events: none;
  }

  /* error line under the form (rare; used when API returns an error) */
  .wf__error {
    font-family: var(--font-sans);
    font-size: 13px;
    color: var(--red);
    margin: 12px 0 0;
    min-height: 18px;
    text-align: center;
  }

  /* ────────────────────────────────────────────────────────────
     success row — replaces the form on a valid submit
  ──────────────────────────────────────────────────────────── */
  .wf-success {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 18px 22px;
    border-radius: var(--radius-lg);
    background: var(--teal-ghost);
    border: 1px solid var(--teal-hairline);
    max-width: 460px;
    margin: 0 auto;
    text-align: left;
  }
  .wf-success__icon {
    flex: 0 0 auto;
    width: 34px;
    height: 34px;
    border-radius: 50%;
    background: var(--teal);
    display: grid;
    place-items: center;
  }
  .wf-success__title {
    font-family: var(--font-serif);
    font-weight: 400;
    font-size: 19px;
    line-height: 1.15;
    color: var(--ink);
    letter-spacing: -0.01em;
  }
  .wf-success__note {
    font-family: var(--font-sans);
    font-size: 13.5px;
    color: var(--ink-muted);
    margin-top: 2px;
  }

  /* ────────────────────────────────────────────────────────────
     motion — visible end-state is base; animate from hidden only
     under prefers-reduced-motion: no-preference. so reduced-motion
     contexts always see content, never a blank.
  ──────────────────────────────────────────────────────────── */
  .fade-up { opacity: 1; }

  @media (prefers-reduced-motion: no-preference) {
    .splash-anim .fade-up {
      opacity: 0;
      animation: sUp 0.74s cubic-bezier(0.16, 1, 0.3, 1) both;
    }
    .splash-anim .smile-path {
      stroke-dasharray: 1;
      stroke-dashoffset: 1;
      animation: sDraw 1.15s cubic-bezier(0.32, 0.72, 0, 1) 0.3s both;
    }
    .wf-success {
      animation: sUp 0.34s cubic-bezier(0.16, 1, 0.3, 1) both;
    }
    .wf-success .wf-check {
      stroke-dasharray: 1;
      stroke-dashoffset: 1;
      animation: sDraw 0.42s ease 0.08s both;
    }
  }

  @keyframes sUp {
    from { opacity: 0; transform: translateY(14px); }
    to   { opacity: 1; transform: none; }
  }
  @keyframes sDraw {
    to { stroke-dashoffset: 0; }
  }
</style>
</head>
<body>

<main class="splash splash-anim" id="splash">
  <div class="splash__inner">

    <!-- wordmark, fade-up + smile draws in -->
    <div class="splash__mark fade-up" style="animation-delay: 0s">
      <span class="wordmark" aria-label="densava" role="img">densa<span class="wordmark__v">v<span class="wordmark__smile-wrap" aria-hidden="true"><svg class="wordmark__smile" viewBox="-5 -13 110 44"><path class="smile-path" d="M 0 0 Q 54 27 100 -8" pathLength="1" /></svg></span></span>a</span>
    </div>

    <!-- headline -->
    <h1 class="splash__head fade-up" style="animation-delay: 0.14s">
      Stronger together in oral health.
    </h1>

    <!-- description -->
    <p class="splash__sub fade-up" style="animation-delay: 0.28s">
      densava turns dental decisions into shared knowledge: what people tried, what helped, what they'd want you to know.
    </p>

    <!-- form block -->
    <div class="splash__formblock fade-up" style="animation-delay: 0.46s" id="form-slot">
      <p class="splash__formlabel">Join the private beta</p>

      <form class="wf" id="signup-form" novalidate>
        <input
          id="signup-email"
          class="wf__input"
          type="email"
          name="email"
          placeholder="you@email.com"
          aria-label="Email address"
          autocomplete="email"
          required
        />
        <button class="wf__btn" type="submit" id="signup-submit" disabled>Notify me</button>
        <!-- honeypot: must stay empty. bots fill it; humans never see it. -->
        <label class="honeypot" aria-hidden="true">
          Leave this field empty
          <input type="text" name="website" tabindex="-1" autocomplete="off" />
        </label>
      </form>
      <p class="wf__error" id="signup-error" role="status" aria-live="polite"></p>
    </div>

  </div>
</main>

<script>
  (function () {
    var form = document.getElementById('signup-form');
    var emailInput = document.getElementById('signup-email');
    var submitButton = document.getElementById('signup-submit');
    var errorEl = document.getElementById('signup-error');
    var formSlot = document.getElementById('form-slot');

    var EMAIL_RE = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

    function setError(message) {
      errorEl.textContent = message || '';
    }

    function isValid() {
      return EMAIL_RE.test(emailInput.value.trim());
    }

    function syncDisabled() {
      submitButton.disabled = !isValid();
    }

    emailInput.addEventListener('input', function () {
      setError('');
      syncDisabled();
    });

    function renderSuccess() {
      // replace the entire form block (eyebrow + form + error line) with a
      // calm success row that uses the same 460px / 16px radius geometry.
      formSlot.innerHTML =
        '<div class="wf-success" role="status">' +
          '<span class="wf-success__icon" aria-hidden="true">' +
            '<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">' +
              '<path class="wf-check" d="M20 6 9 17l-5-5" pathLength="1" />' +
            '</svg>' +
          '</span>' +
          '<div>' +
            '<div class="wf-success__title">You’re on the list.</div>' +
            '<div class="wf-success__note">We’ll reach out the moment your spot opens.</div>' +
          '</div>' +
        '</div>';
    }

    form.addEventListener('submit', function (event) {
      event.preventDefault();
      if (!isValid()) return;

      setError('');
      submitButton.disabled = true;

      var payload = {
        email: emailInput.value.trim(),
        source: 'densava.co',
        website: form.elements['website'].value, // honeypot
      };

      fetch('/api/beta-signup', {
        method: 'POST',
        headers: { 'content-type': 'application/json' },
        body: JSON.stringify(payload),
      })
        .then(function (res) {
          return res.json().then(function (body) { return { ok: res.ok, body: body }; });
        })
        .then(function (result) {
          if (result.ok && result.body.ok) {
            renderSuccess();
          } else {
            var message = (result.body && result.body.error) || 'That didn’t go through — mind trying again?';
            setError(message);
            syncDisabled();
          }
        })
        .catch(function () {
          setError('Network hiccup — mind trying again in a moment?');
          syncDisabled();
        });
    });

    // failsafe: if the entrance animation's timeline is throttled
    // (e.g. this page is embedded in a scaled/background iframe),
    // guarantee content shows after 1.5s.
    setTimeout(function () {
      var els = document.querySelectorAll('.fade-up');
      for (var i = 0; i < els.length; i++) {
        els[i].style.opacity = '1';
      }
    }, 1500);

    // initial state for the submit button
    syncDisabled();
  })();
</script>

</body>
</html>
