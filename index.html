<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>densava — Stronger together in oral health</title>
<meta name="description" content="densava is a patient-side dental decision-support platform. People navigate dental decisions together." />
<meta name="theme-color" content="#F7F5F0" />

<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
<link rel="apple-touch-icon" href="/favicon.svg" />

<meta property="og:type" content="website" />
<meta property="og:title" content="densava" />
<meta property="og:description" content="Stronger together in oral health." />
<meta property="og:url" content="https://densava.co" />
<meta name="twitter:card" content="summary" />
<meta name="twitter:title" content="densava" />
<meta name="twitter:description" content="Stronger together in oral health." />

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=DM+Serif+Display&family=Outfit:wght@500;600&display=swap" rel="stylesheet" />

<style>
  :root {
    --navy: #1B2D4F;
    --teal: #0D7377;
    --teal-lt: #E8F4F5;
    --cream: #F7F5F0;
    --gray: #6B7280;
    --gray-mid: #9BAAB8;
    --border: #DDE2E8;
    --red: #C0544A;
  }

  *, *::before, *::after { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--cream);
    color: var(--navy);
    font-family: 'DM Sans', system-ui, -apple-system, sans-serif;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }

  main {
    min-height: 100svh;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 72px 24px;
    text-align: center;
  }

  /* on phones, drop the wordmark closer to the top edge instead of
     vertically centering — center-justified looks like wasted whitespace
     above the fold on a tall portrait viewport. */
  @media (max-width: 640px) {
    main {
      padding: 40px 20px 32px;
      justify-content: flex-start;
    }
  }

  /* visually hide content for sighted users but keep it for screen readers */
  .visually-hidden {
    position: absolute;
    width: 1px;
    height: 1px;
    padding: 0;
    margin: -1px;
    overflow: hidden;
    clip: rect(0, 0, 0, 0);
    white-space: nowrap;
    border: 0;
  }

  .wordmark {
    font-family: 'Outfit', sans-serif;
    font-weight: 500;
    letter-spacing: -0.02em;
    line-height: 1;
    white-space: nowrap;
    display: inline-block;
    color: var(--navy);
    font-size: clamp(48px, 9vw, 80px);
    margin-bottom: 64px;
  }
  .wordmark__v { display: inline-block; position: relative; }
  .wordmark__smile-wrap {
    position: absolute;
    left: 50%;
    top: 100%;
    transform: translateX(-50%);
    padding-top: 0.09em;
    line-height: 0;
  }
  .wordmark__smile {
    display: block;
    overflow: visible;
    width: 0.58em;
    height: calc(0.58em * (44 / 110));
  }
  .wordmark__smile path {
    fill: none;
    stroke: var(--teal);
    stroke-width: 9;
    stroke-linecap: round;
  }

  .tagline {
    font-family: 'DM Serif Display', Georgia, serif;
    font-weight: 400;
    font-size: clamp(28px, 4.2vw, 40px);
    line-height: 1.15;
    color: var(--navy);
    max-width: 680px;
    margin: 0 0 28px;
  }

  .blurb {
    font-family: 'DM Sans', sans-serif;
    font-weight: 400;
    font-size: clamp(16px, 1.6vw, 17px);
    line-height: 1.6;
    color: var(--gray);
    max-width: 540px;
    margin: 0 auto 56px;
  }

  /* signup form */
  .signup {
    width: 100%;
    max-width: 460px;
    margin: 0 auto;
  }

  .signup__eyebrow {
    font-family: 'DM Sans', sans-serif;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--teal);
    margin: 0 0 16px;
  }

  .signup__row {
    display: flex;
    gap: 8px;
    background: #FFFFFF;
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 7px;
  }

  .signup__input {
    flex: 1;
    min-width: 0;
    border: none;
    background: transparent;
    font-family: 'DM Sans', sans-serif;
    font-size: 16px;
    color: var(--navy);
    padding: 13px 16px;
    outline: none;
  }

  .signup__input::placeholder { color: var(--gray-mid); }

  /* kill chrome/safari autofill yellow + keep the field looking the same
     when prefilled. the giant inset box-shadow paints over the browser's
     yellow with the form's white. the 600000s transitions stop the browser
     from re-applying its color on focus/blur. */
  .signup__input:-webkit-autofill,
  .signup__input:-webkit-autofill:hover,
  .signup__input:-webkit-autofill:focus,
  .signup__input:-webkit-autofill:active {
    -webkit-box-shadow: 0 0 0 1000px #FFFFFF inset !important;
    -webkit-text-fill-color: var(--navy) !important;
    caret-color: var(--navy) !important;
    transition: background-color 0s 600000s, color 0s 600000s !important;
  }

  .signup__button {
    flex: 0 0 auto;
    background: var(--teal);
    color: #FFFFFF;
    font-family: 'DM Sans', sans-serif;
    font-weight: 600;
    font-size: 14px;
    border: none;
    border-radius: 11px;
    padding: 13px 22px;
    cursor: pointer;
    transition: filter 120ms ease;
  }

  .signup__button:hover { filter: brightness(1.08); }
  .signup__button:disabled { opacity: 0.55; cursor: not-allowed; }

  /* honeypot — visually hidden but technically still in the form */
  .honeypot {
    position: absolute;
    left: -10000px;
    width: 1px;
    height: 1px;
    overflow: hidden;
    opacity: 0;
    pointer-events: none;
  }

  .signup__status {
    font-family: 'DM Sans', sans-serif;
    font-size: 13px;
    margin: 16px 0 0;
    min-height: 18px;
  }

  .signup__status--ok    { color: var(--teal); }
  .signup__status--error { color: var(--red); }

  footer {
    font-family: 'DM Sans', sans-serif;
    font-size: 12px;
    color: var(--gray);
    padding: 24px;
    text-align: center;
    opacity: 0.7;
  }
</style>
</head>
<body>

<main>
  <span class="wordmark" aria-label="densava" role="img">densa<span class="wordmark__v">v<span class="wordmark__smile-wrap" aria-hidden="true"><svg class="wordmark__smile" viewBox="-5 -13 110 44"><path d="M 0 0 Q 54 27 100 -8" /></svg></span></span>a</span>

  <h1 class="tagline">Stronger together in oral health.</h1>

  <p class="blurb">densava is a patient-side platform for navigating dental decisions. People log a concern, see what others in the same situation chose to do, and make a more informed call about what comes next.</p>

  <form class="signup" id="signup-form" novalidate>
    <p class="signup__eyebrow">Join the beta waitlist</p>
    <div class="signup__row">
      <input
        id="signup-email"
        class="signup__input"
        type="email"
        name="email"
        placeholder="you@email.com"
        aria-label="Your email address"
        autocomplete="email"
        required
      />
      <button class="signup__button" type="submit" id="signup-submit">Notify me</button>
    </div>
    <!-- honeypot: must stay empty. bots fill it; humans never see it. -->
    <label class="honeypot" aria-hidden="true">
      Leave this field empty
      <input type="text" name="website" tabindex="-1" autocomplete="off" />
    </label>
    <p class="signup__status" id="signup-status" role="status" aria-live="polite"></p>
  </form>
</main>

<footer>© 2026 densava, PBC</footer>

<script>
  (function () {
    var form = document.getElementById('signup-form');
    var status = document.getElementById('signup-status');
    var emailInput = document.getElementById('signup-email');
    var submitButton = document.getElementById('signup-submit');

    function setStatus(message, kind) {
      status.textContent = message;
      status.className = 'signup__status' + (kind ? ' signup__status--' + kind : '');
    }

    form.addEventListener('submit', function (event) {
      event.preventDefault();
      setStatus('');
      submitButton.disabled = true;

      var payload = {
        email: emailInput.value.trim(),
        source: 'densava.co',
        website: form.elements['website'].value, // honeypot
      };

      fetch('/api/beta-signup', {
        method: 'POST',
        headers: { 'content-type': 'application/json' },
        body: JSON.stringify(payload),
      })
        .then(function (res) {
          return res.json().then(function (body) { return { ok: res.ok, body: body }; });
        })
        .then(function (result) {
          if (result.ok && result.body.ok) {
            setStatus("Thanks — we'll be in touch when beta opens.", 'ok');
            emailInput.value = '';
            submitButton.disabled = false;
          } else {
            var message = (result.body && result.body.error) || 'Something went wrong. Please try again.';
            setStatus(message, 'error');
            submitButton.disabled = false;
          }
        })
        .catch(function () {
          setStatus('Network error. Please try again.', 'error');
          submitButton.disabled = false;
        });
    });
  })();
</script>

</body>
</html>
