<style>
  :root {
    --navy: #1B2D4F;
    --teal: #0D7377;
    --teal-lt: #E8F4F5;
    --cream: #F7F5F0;
    --gray: #6B7280;
    --border: #DDE2E8;
  }

  *, *::before, *::after { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--cream);
    color: var(--navy);
    font-family: 'DM Sans', system-ui, -apple-system, sans-serif;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }

  main {
    min-height: 100svh;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 48px 24px;
    text-align: center;
  }

  .wordmark {
    font-family: 'Outfit', sans-serif;
    font-weight: 500;
    letter-spacing: -0.02em;
    line-height: 1;
    white-space: nowrap;
    display: inline-block;
    color: var(--navy);
    font-size: clamp(48px, 9vw, 80px);
    margin-bottom: 40px;
  }

  .wordmark__v { display: inline-block; position: relative; }
  .wordmark__smile-wrap {
    position: absolute;
    left: 50%;
    top: 100%;
    transform: translateX(-50%);
    padding-top: 0.09em;
    line-height: 0;
  }
  .wordmark__smile {
    display: block;
    overflow: visible;
    width: 0.58em;
    height: calc(0.58em * (44 / 110));
  }
  .wordmark__smile path {
    fill: none;
    stroke: var(--teal);
    stroke-width: 9;
    stroke-linecap: round;
  }

  .tagline {
    font-family: 'DM Serif Display', Georgia, serif;
    font-weight: 400;
    font-size: clamp(24px, 4vw, 36px);
    line-height: 1.2;
    color: var(--navy);
    max-width: 680px;
    margin: 0 0 24px;
  }

  .blurb {
    font-family: 'DM Sans', sans-serif;
    font-weight: 400;
    font-size: clamp(16px, 1.7vw, 18px);
    line-height: 1.55;
    color: var(--gray);
    max-width: 560px;
    margin: 0 auto 40px;
  }

  .contact {
    font-family: 'DM Sans', sans-serif;
    font-size: 14px;
    color: var(--gray);
  }

  .contact a {
    color: var(--teal);
    text-decoration: none;
    border-bottom: 1px solid transparent;
    transition: border-color 160ms ease;
  }

  .contact a:hover { border-bottom-color: var(--teal); }

  footer {
    font-family: 'DM Sans', sans-serif;
    font-size: 12px;
    color: var(--gray);
    padding: 24px;
    text-align: center;
    opacity: 0.7;
  }
</style>
</head>
<body>

<main>
  <span class="wordmark" aria-label="densava" role="img">densa<span class="wordmark__v">v<span class="wordmark__smile-wrap" aria-hidden="true"><svg class="wordmark__smile" viewBox="-5 -13 110 44"><path d="M 0 0 Q 54 27 100 -8" /></svg></span></span>a</span>

  <h1 class="tagline">Stronger together in oral health.</h1>

  <p class="blurb">densava is a patient-side platform for navigating dental decisions. People log a concern, see what others in the same situation chose to do, and make a more informed call about what comes next.</p>

  <p class="contact">Get in touch — <a href="mailto:hello@densava.co">hello@densava.co</a></p>
</main>

<footer>© 2026 densava, Inc.</footer>

</body>
